apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yas-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ltpisme/CSC110007_Project.git
    targetRevision: cd/setup
    path: k8s/charts/yas-app
    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
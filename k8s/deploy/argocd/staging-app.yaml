apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yas-staging
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ltpisme/CSC110007_Project.git
    targetRevision: cd/setup
    path: k8s/charts/yas-app
    helm:
      valueFiles:
        - values-staging.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true